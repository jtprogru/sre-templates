version: 1

frontmatter:
  id: "{{ .ID }}"
  creation_date: "{{ .Now }}"
  type: oncall-report
  team: "{{ .Team }}"
  period_start: "{{ .Start }}"
  period_end: "{{ .End }}"
  oncaller: "{{ .Author.Name }}"
  tags:
    - oncall
    - weekly-report

title: "Отчёт по дежурству (On-call report) — {{ .Team }} ({{ .Start }} → {{ .End }})"

meta_bullets:
  - "**Дежурный (On-caller):** {{ .Author.Name }} <{{ .Author.Email }}>"
  - "**Период (Period):** {{ .Start }} → {{ .End }}"

sections:
  - id: tl_dr
    title: TL;DR
    type: text
    default_body: |
      _2–3 предложения: как прошла смена? спокойно / напряжённо / в огне?_
  - id: pages
    title: Пейджеры (Pages)
    type: table
    columns:
      - Время (UTC)
      - Алерт
      - Сервис
      - Действие / результат
      - Постмортем?
    rows:
      - - ""
        - ""
        - ""
        - ""
        - ""
  - id: incidents
    title: Инциденты (Incidents)
    type: text
    default_body: |
      - _Ссылки на инцидент-доки / постмортемы._
  - id: toil
    title: Тоил (Toil)
    type: text
    default_body: |
      _Повторяющаяся ручная работа, съевшая время. Каждый пункт — кандидат на автоматизацию._

      - [ ]
  - id: alert_hygiene
    title: Гигиена алертов (Alert hygiene)
    type: text
    default_body: |
      - Шумные алерты (стоит подкрутить):
        -
      - Недостающие алерты (узнали о проблеме «на собственной шкуре»):
        -
  - id: follow_ups_for_next_on_caller
    title: Передать следующему дежурному (Follow-ups for next on-caller)
    type: text
    default_body: |
      - [ ]
  - id: wins
    title: Победы (Wins)
    type: text
    default_body: |
      -
  - id: references
    title: Ссылки (References)
    type: text
    default_body: |
      -
