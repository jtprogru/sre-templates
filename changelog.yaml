version: 1

title: Changelog

header_body: |
  All notable changes to this project will be documented in this file.
  
  The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
  and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

sections:
  - id: unreleased
    title: '[Unreleased]'
    type: text
    default_body: |
      ### Added

      -

      ### Changed

      -

      ### Deprecated

      -

      ### Removed

      -

      ### Fixed

      -

      ### Security

      -
  - id: initialversion_today
    title: '[{{ .InitialVersion }}] - {{ .Today }}'
    type: text
    default_body: |
      ### Added

      - Initial release.

      [Unreleased]: https://github.com/{{ .Repo }}/compare/v{{ .InitialVersion }}...HEAD
      [{{ .InitialVersion }}]: https://github.com/{{ .Repo }}/releases/tag/v{{ .InitialVersion }}
