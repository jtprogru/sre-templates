name: validate-templates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Репозиторий с релизами srekit.
  SREKIT_REPO: jtprogru/srekit
  # Запиненная версия srekit для воспроизводимых проверок на PR.
  # Бампай вручную; weekly drift.yml подскажет, когда апстрим ушёл вперёд.
  SREKIT_VERSION: v0.32.1
  # Имя linux/amd64 ассета релиза (GoReleaser).
  SREKIT_ASSET_PATTERN: "srekit_Linux_x86_64.tar.gz"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install srekit from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/srekit
          gh release download "$SREKIT_VERSION" --repo "$SREKIT_REPO" \
            --pattern "$SREKIT_ASSET_PATTERN" --dir /tmp/srekit
          tar -xzf /tmp/srekit/*.tar.gz -C /tmp/srekit
          bin="$(find /tmp/srekit -type f -name srekit | head -n1)"
          if [ -z "$bin" ]; then
            echo "srekit binary not found in release asset" >&2
            exit 1
          fi
          sudo install -m 0755 "$bin" /usr/local/bin/srekit
          srekit --version

      - name: Validate override templates
        env:
          SREKIT_TEMPLATES_DIR: ${{ github.workspace }}
        run: srekit templates validate
